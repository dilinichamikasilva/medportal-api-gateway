spring.application.name=api-gateway
server.port=8080

# Local testing Bypass
spring.config.import=optional:configserver:http://localhost:8888

# Eureka Client Setup
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

# Spring Cloud Gateway Routing Configurations (Uppercase Service Names)
spring.cloud.gateway.routes[0].id=appointment-service
spring.cloud.gateway.routes[0].uri=lb://APPOINTMENT-SERVICE
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/v1/appointments/**

spring.cloud.gateway.routes[1].id=clinical-record-service
spring.cloud.gateway.routes[1].uri=lb://CLINICAL-RECORD-SERVICE
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/v1/records/**

spring.cloud.gateway.routes[2].id=lab-report-service
spring.cloud.gateway.routes[2].uri=lb://LAB-REPORT-SERVICE
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/v1/lab-reports/**